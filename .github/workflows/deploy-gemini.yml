name: Deploy Gemini API Worker

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-gemini.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          preCommands: |
            wrangler deploy
          command: deploy
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Configure Pages and redeploy
        if: ${{ steps.deploy.outputs.deployment-url != '' }}
        uses: actions/github-script@v7
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = new URL(process.env.WORKER_URL).origin;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const name = "GEMINI_API_ENDPOINT";
            try {
              await github.rest.actions.getRepoVariable({ owner, repo, name });
              await github.rest.actions.updateRepoVariable({ owner, repo, name, value: url });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.actions.createRepoVariable({ owner, repo, name, value: url });
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: "pages.yml", ref: "main"
            });
