name: Deploy Writing Study Room to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Add Gemini service URL
        env:
          GEMINI_API_ENDPOINT: https://fsk-writing-study-room-gemini.fkycenglishdept.workers.dev
        run: |
          printf 'window.GEMINI_API_BASE = "%s";\n' "$GEMINI_API_ENDPOINT" > gemini-config.js

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
