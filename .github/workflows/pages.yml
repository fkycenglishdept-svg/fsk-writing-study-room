name: Deploy Writing Study Room to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Gemini endpoint config
        env:
          GEMINI_API_ENDPOINT: ${{ vars.GEMINI_API_ENDPOINT }}
        run: |
          node -e 'const fs = require("node:fs"); const endpoint = process.env.GEMINI_API_ENDPOINT || ""; fs.writeFileSync("gemini-config.js", "window.GEMINI_API_ENDPOINT = " + JSON.stringify(endpoint) + ";\\n"); console.log(endpoint ? "Gemini endpoint configured." : "GEMINI_API_ENDPOINT is not set.");'

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
