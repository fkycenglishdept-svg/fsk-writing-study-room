function evidenceFor(topic,claim=''){
  if(!/讀書|學歷|教育|閱讀|學習的價值/.test(topic))return [];

  return VERIFIED_EVIDENCE.map(e=>({e,score:e.keywords.filter(k=>claim.includes(k)).length})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,2).map(x=>x.e);
}

function depthQuestion(text){

let coachBusy=false;
let providerReady=false;
store.helpLevel=Number.isInteger(saved.helpLevel)?Math.max(0,Math.min(4,saved.helpLevel)):0;

function supportReply(){
  store.stage=currentTask().stage;
  if(store.helpStage!==store.stage)store.helpLevel=0;
  store.helpStage=store.stage;
  store.helpLevel=Math.min(4,Math.max(store.stage===2?3:1,store.helpLevel+1));
  const evidence=supportMaterial().evidence;
  let question=taskQuestion();
  if(store.stage===1&&store.helpLevel===1)question=/讀書無用/.test(store.config.topic)?'先選一個尚未使用的角度，例如工作機會、解決問題的能力或學習的長遠價值，再寫一項支持你立場的理由。':'先選一個受影響的對象，指出這個做法對他有哪一項具體好處或限制。';
  if(store.helpLevel===2)question=store.stage===0?'請完成這句：「我（同意／不同意／部分同意）題目的說法，因為＿＿。」先寫你的看法即可。':'先選一種具體影響（機會、能力或限制），完成「這能／未必能幫助＿＿做到＿＿」。';

async function askCoach(text){
  const answer=String(text||'').trim();
  if(!answer||coachBusy)return;
  coachBusy=true;
  if(currentTask().stage===3){toast('大綱已完成，可以儲存學習報告。');coachBusy=false;return;}
  const previousMessages=store.messages.slice();
  store.messages.push({from:'student',text:answer});
  render();
  try{
    if(providerReady){
      const response=await fetch('/api/essay-coach',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:answer,topic:store.config.topic,prompt:store.config.prompt,rubrics:store.config.rubrics,target:store.config.target,stage:currentTask().stage,pointIndex:currentTask().index,helpLevel:store.helpLevel,draft:store.draft,messages:previousMessages.slice(-20)}),signal:AbortSignal.timeout(55000)});
      const result=await response.json();
      if(!response.ok)throw Error(result.error||'Gemini 暫時未能回應');
      if(result.needsSupport){
        const reply=supportReply();
        reply.text=result.message;
        reply.support.evidenceIds=Array.isArray(result.evidenceIds)?result.evidenceIds:[];
        if(result.supportKind==='depth')reply.support.level=1;
        else if(result.supportKind==='reading')reply.support.level=Math.max(3,reply.support.level);
        store.messages.push(reply);
      }else{
        coachReply(answer);
        store.helpLevel=0;
        store.messages.push({from:'coach',text:currentTask().stage===1?taskQuestion():result.message});
      }
    }else if(depthQuestion(answer)){
      store.messages.push({from:'coach',text:depthQuestion(answer),support:{level:1,evidenceIds:[]}});
    }else if(vagueAnswer(answer)){
      store.messages.push(supportReply());
    }else{
      store.helpLevel=0;
      const reply=coachReply(answer);
      store.messages.push({from:'coach',move:reply.move,text:reply.text});
    }
  }catch(error){
    store.messages.push({from:'coach',text:'這次未能取得 Gemini 回覆，學習階段沒有前進。請稍後再送出你的回答。'});
    toast(error.name==='TimeoutError'?'Gemini 回覆逾時，請重試。':error.message);
  }finally{
    coachBusy=false;
    save();render();celebrateProgress();
    const log=document.querySelector('#chat-log');
    if(log)log.scrollTop=log.scrollHeight;
  }
}

}

function mobileNav(){const links=store.role==='teacher'?[['settings','題目設定'],['reports','學習報告']]:[['coach','對話引導'],['draft','我的架構']];return '<nav class="mobile-nav">'+links.map(([id,label])=>'<button data-action="view" data-view="'+id+'" class="'+(store.view===id?'active':'')+'">'+label+'</button>').join('')+'</nav>';}
function studentView(){ensureMessages();const p=progress();return `<div class="layout"><aside class="sidebar"><p class="side-kicker">Learning space</p><nav class="side-nav"><button data-action="view" data-view="coach" class="${store.view==='coach'?'active':''}">${icon('spark')} AI 對話引導</button><button data-action="view" data-view="draft" class="${store.view==='draft'?'active':''}">${icon('book')} 我的論證架構</button></nav></aside><main class="main">${mobileNav()}<div class="page-head"><div><div class="eyebrow">STUDENT WORKSPACE · 01</div><h1>把想法，寫成論證。</h1><p>不代你寫答案，只幫你把思考說清楚。</p></div><div class="head-meta"><strong>${p}%</strong>架構完成度<br><span>${esc(stageLabel())}</span></div></div><div class="assignment"><div class="eyebrow">本次練習題目</div><h3>${esc(store.config.topic)}</h3><p>${esc(store.config.prompt)}</p><div class="assignment-tags"><span class="tag active">${icon('spark')} 三個分論點＋各自的事例</span><span class="tag">${icon('check')} 教師已設定評分參考</span></div></div><div class="steps">${['立場','分論點','事例','完成'].map((s,i)=>`<div class="step ${i===Math.min(store.stage,3)?'active':i<store.stage?'done':''}"><strong>${i<store.stage?'✓ ':''}${s}</strong>${['表明看法','逐一構思','配對合適例子','檢查大綱'][i]}</div>`).join('')}</div>${store.view==='coach'?`<div class="grid-2"><section class="panel canvas">${canvas()}</section><section class="panel chat-panel">${chatPanel()}</section></div>`:`<section class="panel canvas" style="position:static">${canvas(true)}</section>`}<p class="footer-note">示範版資料只保存在本機瀏覽器；接入校方帳戶及資料庫後，可由教師後台集中查看。</p></main></div>`;}
function chatPanel(){const latest=store.messages.map(m=>m.from).lastIndexOf('coach');return `<div class="chat-head"><div class="coach-id"><div class="coach-avatar">論</div><div><strong>論證教練</strong><small>逐步提問 · 整理想法</small></div></div><span class="online"><i></i>${providerReady?'Gemini 3.6 · Thinking':'離線提示試行'}</span></div><div class="chat-log" id="chat-log">${store.messages.map((m,i)=>`<div class="bubble-row ${m.from==='student'?'me':''} ${i===latest?'latest-coach':''}"><div class="bubble">${esc(m.text)}${supportMarkup(m)}</div></div>`).join('')}</div><div class="typing" id="typing"></div><div class="chat-compose"><div class="quick-prompts"><button data-action="quick" data-text="我對題目的立場是……，因為……">我想先試寫立場</button><button data-action="quick" data-text="我還想到另一個角度：……">再加一個分論點</button><button data-action="quick" data-text="我想不到相關事例，請提供閱讀資料">找一項具體論據</button></div><div class="compose-row"><textarea id="coach-input" rows="2" placeholder="寫下你的想法，教練會追問下一步……"></textarea><button class="btn primary" data-action="send" ${coachBusy?'disabled':''}>${coachBusy?'思考中…':'送出'} ${icon('arrow')}</button></div></div>`;}
function canvas(full=false){const d=store.draft;return `<div class="canvas-head"><div><h2>論證架構</h2><p>立場、分論點及配對事例。</p></div><div class="completion">${progress()}%<div class="completion-bar"><span style="width:${progress()}%"></span></div></div></div><div class="draft-card position"><h3>中心立場</h3><p>${esc(d.position||'先寫出你的立場。')}</p></div>${d.points.map((p,i)=>`<div class="draft-card point"><h3>分論點 ${i+1}</h3><p>${esc(p.claim||'待構思')}</p><div class="mini-line"><b>事例（論據）：</b>${esc(p.evidence||'待配對合適的事例')}</div></div>`).join('')}<div class="card-actions">${full?'<button class="btn ghost" data-action="reset">重新開始</button>':''}<button class="btn gold" data-action="report">儲存學習報告</button></div>`;}
function teacherView(){return `<div class="layout"><aside class="sidebar"><p class="side-kicker">Teaching space</p><nav class="side-nav"><button data-action="view" data-view="settings" class="${store.view==='settings'?'active':''}">${icon('settings')} 題目與評分設定</button><button data-action="view" data-view="reports" class="${store.view==='reports'?'active':''}">${icon('chart')} 學生學習報告</button></nav><div class="side-note"><strong>教師後台</strong>本機試行：設定題目與目標結構，體驗提問及報告流程。</div></aside><main class="main">${mobileNav()}<div class="page-head"><div><div class="eyebrow">TEACHER CONSOLE · LOCAL DEMO</div><h1>${store.view==='reports'?'看見學生怎樣思考。':'設定一個好的追問路線。'}</h1><p>${store.view==='reports'?'從對話歷程和論證架構了解學生的學習情況。':'題目和評分參考會成為 AI 教練的教學脈絡。'}</p></div><div class="head-meta"><strong>${store.reports.length}</strong>份已儲存報告<br><span>教師測試版</span></div></div>${store.view==='reports'?reportsView():settingsView()}<p class="footer-note">後台現時以示範資料運作；正式版可接入校方登入、資料庫及真正的 AI 模型服務。</p></main></div>`;}
function settingsView(){const c=store.config;return `<section class="teacher-section panel panel-pad"><h2>題目與評分參考</h2><p class="section-sub">這些設定會影響學生看到的題目、AI 的提問方向和報告中的評估項目。</p><div class="model-card"><div><strong>建議模型：GPT-5 mini</strong><p>適合高頻率的中文追問、結構化回應和學習紀錄；需要更複雜的長文評析時，可改用 GPT-5。</p></div><span class="model-badge">可替換</span></div><form id="settings-form" style="margin-top:20px"><div class="form-grid"><div class="form-field full"><label for="setting-topic">議論文題目</label><input id="setting-topic" name="topic" value="${esc(c.topic)}" required></div><div class="form-field full"><label for="setting-prompt">寫作要求／背景</label><textarea id="setting-prompt" name="prompt" required>${esc(c.prompt)}</textarea></div><div class="form-field"><label for="setting-target">目標結構</label><select id="setting-target" name="target"><option value="three" ${c.target==='three'?'selected':''}>三個分論點＋各自的事例</option></select></div><div class="form-field"><label for="setting-model">AI 模型</label><select id="setting-model" name="model"><option value="gpt-5-mini" ${c.model==='gpt-5-mini'?'selected':''}>GPT-5 mini（建議）</option><option value="gpt-5">GPT-5（較深度分析）</option><option value="mock">示範模式（無 API）</option></select></div><div class="form-field full"><div class="rubric-box"><h3>評分參考（會顯示在教師報告）</h3><div class="check-grid">${defaultConfig.rubrics.map((r,i)=>`<label class="check"><input type="checkbox" name="rubric" value="${esc(r)}" ${(c.rubrics||[]).includes(r)?'checked':''}>${esc(r)}</label>`).join('')}</div></div></div></div><div class="form-actions"><button type="button" class="btn ghost" data-action="reset-config">還原示範題目</button><button class="btn primary" type="submit">儲存設定 ${icon('check')}</button></div></form></section>`;}
function reportsView(){if(!store.reports.length)return `<section class="panel empty">尚未有學生報告。先切換到「學生端」完成一次示範，再回來查看報告。</section>`;return `<div class="stats"><div class="stat"><span>已提交報告</span><strong>${store.reports.length}</strong><small>份學習紀錄</small></div><div class="stat"><span>平均完成度</span><strong>${Math.round(store.reports.reduce((a,r)=>a+r.progress,0)/store.reports.length)}%</strong><small>架構建立情況</small></div><div class="stat"><span>已填立場</span><strong>${store.reports.filter(r=>r.position).length}</strong><small>學生能表明取態</small></div><div class="stat"><span>事例齊備</span><strong>${store.reports.filter(r=>(r.examples||[]).filter(Boolean).length===3).length}</strong><small>三個分論點均有事例</small></div></div><section class="report-list">${store.reports.map((r,i)=>`<article class="panel report-row"><div><h3>${esc(r.student||'示範學生')}</h3><p>${esc(r.topic)} · ${esc(r.time)}</p></div><div><div class="report-progress"><span style="width:${r.progress}%"></span></div><p style="margin-top:6px">${r.progress}% 架構完成度</p></div><div class="report-score">${r.points}<small>個分論點已捕捉</small></div><span class="report-chip">${(r.examples||[]).filter(Boolean).length===3?'事例齊備':'仍需補充事例'}</span><button class="btn ghost" data-action="toggle-report" data-index="${i}">查看詳情 ${icon('arrow')}</button>${store.expandedReport===i?`<div class="report-detail"><b>立場：</b>${esc(r.position||'尚未填寫')}<br><b>分論點：</b>${esc(r.claims.join('；')||'尚未填寫')}<br><b>配對事例：</b>${esc((r.examples||[]).map((v,i)=>'分論點'+(i+1)+'：'+(v||'待補充')).join('；')||'舊報告未記錄事例')}<br><b>教學建議：</b>${esc(r.suggestion)}</div>`:''}</article>`).join('')}</section><div class="form-actions"><button class="btn primary" data-action="export-reports">${icon('download')} 匯出 CSV</button><button class="btn danger" data-action="clear-reports">清除示範報告</button></div>`;}
function submitReport(){const d=store.draft;const report={student:'student01（示範）',topic:store.config.topic,time:new Intl.DateTimeFormat('zh-HK',{dateStyle:'medium',timeStyle:'short'}).format(new Date()),progress:progress(),points:d.points.filter(p=>p.claim).length,position:d.position,claims:d.points.map(p=>p.claim),examples:d.points.map(p=>p.evidence),suggestion:progress()<100?'請補齊分論點及對應的具體事例。':'請檢查三個分論點是否互不重複，以及事例是否適切。'};store.reports=[report,...store.reports.filter(r=>r.student!=='student01（示範）')];save();toast('已儲存學習報告。');render();}
function resetDraft(){rewardedMilestones.clear();store.draft={position:'',points:[{claim:'',evidence:'',reasoning:''},{claim:'',evidence:'',reasoning:''},{claim:'',evidence:'',reasoning:''}],rebuttal:{opposing:'',response:''}};store.messages=[];store.stage=0;store.helpLevel=0;store.helpStage=0;save();render();toast('已重新開始這次練習。');}
function exportReports(){const rows=[['學生','題目','完成度','分論點數','配對事例','立場','分論點','日期'],...store.reports.map(r=>[r.student,r.topic,r.progress+'%',r.points,(r.examples||[]).map((v,i)=>'分論點'+(i+1)+'：'+v).join('；'),r.position,r.claims.join('；'),r.time])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='議論文學習報告.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已匯出 CSV 報告。');}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const a=b.dataset.action;
  if(a==='login-portal'&&!store.role){loginPortal=b.dataset.role==='teacher'?'teacher':'student';render();return;}
  if(!store.role)return;
  if(a==='logout'&&!coachBusy){loginPortal=store.role;store.role=null;render();return;}
  if(a==='view'){
    const allowed=store.role==='teacher'?['settings','reports']:['coach','draft'];
    if(allowed.includes(b.dataset.view)){store.view=b.dataset.view;render();}
  }else if(a==='send'&&store.role==='student'){const input=$('#coach-input');if(input?.value.trim())askCoach(input.value.trim());}
  else if(a==='quick'&&store.role==='student'){const input=$('#coach-input');if(input){input.value=b.dataset.text;input.focus();}}
  else if(a==='report'&&store.role==='student')submitReport();
  else if(a==='reset'&&store.role==='student'&&!coachBusy)resetDraft();
  else if(store.role==='teacher'){
    if(a==='reset-config'){store.config={...defaultConfig};save();render();toast('已還原示範題目。');}
    else if(a==='toggle-report'){store.expandedReport=store.expandedReport===Number(b.dataset.index)?null:Number(b.dataset.index);render();}
    else if(a==='export-reports')exportReports();
    else if(a==='clear-reports'){store.reports=[];save();render();toast('已清除示範報告。');}
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='essay-login-form'){
    e.preventDefault();const fd=new FormData(e.target);
    const teacher=loginPortal==='teacher';
    if(fd.get('username').trim()!==(teacher?'teacher01':'student01')||fd.get('password')!==(teacher?'Teach123!':'Learn123!')){
      $('#login-error').textContent='帳戶或密碼不正確，請使用此入口的示範帳戶。';return;
    }
    store.role=loginPortal;store.view=teacher?'settings':'coach';render();return;
  }
  if(e.target.id!=='settings-form'||store.role!=='teacher')return;
  e.preventDefault();const fd=new FormData(e.target);
  store.config={topic:fd.get('topic').trim(),prompt:fd.get('prompt').trim(),target:'three',model:'gemini-3.6-flash',rubrics:fd.getAll('rubric')};
  store.messages=[];store.stage=0;store.helpLevel=0;store.helpStage=0;rewardedMilestones.clear();
  store.draft={position:'',points:[{claim:'',evidence:'',reasoning:''},{claim:'',evidence:'',reasoning:''},{claim:'',evidence:'',reasoning:''}],rebuttal:{opposing:'',response:''}};
  save();toast('題目與評分參考已儲存。');render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey&&e.target.id==='coach-input'){e.preventDefault();const b=document.querySelector('[data-action="send"]');b?.click();}});
function normalizeState(){const raw=store.draft&&typeof store.draft==='object'?store.draft:{};const rawPoints=Array.isArray(raw.points)?raw.points:[];store.config={...defaultConfig,...(store.config&&typeof store.config==='object'?store.config:{})};store.draft={position:typeof raw.position==='string'?raw.position:'',points:[0,1,2].map(i=>{const p=rawPoints[i]&&typeof rawPoints[i]==='object'?rawPoints[i]:{};return {claim:typeof p.claim==='string'?p.claim:'',evidence:typeof p.evidence==='string'?p.evidence:'',reasoning:typeof p.reasoning==='string'?p.reasoning:''};}),rebuttal:{opposing:typeof raw.rebuttal?.opposing==='string'?raw.rebuttal.opposing:'',response:typeof raw.rebuttal?.response==='string'?raw.rebuttal.response:''}};store.messages=Array.isArray(store.messages)?store.messages.filter(m=>m&&typeof m.text==='string').map(m=>({from:m.from==='student'?'student':'coach',move:typeof m.move==='string'?m.move:'',text:m.text,support:m.support&&typeof m.support==='object'?m.support:null})):[];store.reports=Array.isArray(store.reports)?store.reports.filter(r=>r&&typeof r==='object').map(r=>({...r,claims:Array.isArray(r.claims)?r.claims.filter(Boolean):[]})):[];store.stage=Number.isFinite(Number(store.stage))?Math.max(0,Math.min(6,Math.floor(Number(store.stage)))):0;}
normalizeState();
store.config.target='three';
store.config.rubrics=(store.config.rubrics||[]).filter(x=>!['能說明論據如何支持分論點','能預想反方觀點並有效駁論'].includes(x));
if(!store.config.rubrics.includes('事例能支持對應分論點'))store.config.rubrics.push('事例能支持對應分論點');
if(store.config.prompt.includes('具體論據及完整論證'))store.config.prompt=defaultConfig.prompt;
store.stage=currentTask().stage;
if(saved.flowVersion!==2&&store.messages.some(m=>m.from==='student'))store.messages.push({from:'coach',text:'學習流程已更新為立場、分論點及配對事例。'+taskQuestion()});

store.messages=store.messages.map(m=>m.support&&!Array.isArray(m.support.evidenceIds)?{...m,text:'過往的閱讀提示已停用。請重新要求閱讀資料，以查看附有已核對來源的材料。',support:null}:m);
rewardedMilestones=new Set(milestoneKeys());
// Adopt the new sample only when no existing student work would be relabelled.
if(store.config.topic==='中學生應否限制使用生成式人工智能？'&&!store.draft.position.trim()&&!store.messages.some(m=>m.from==='student')){
  store.config.topic=defaultConfig.topic;
}
if(!store.messages.some(m=>m.from==='student'))store.messages=initialMessages();
else store.messages=store.messages.map(m=>m.move==='Welcome'?initialMessages()[0]:m);
store.config.model='gemini-3.6-flash';
const originalRender=render;
render=function(){originalRender();const card=document.querySelector('.model-card strong');if(card)card.textContent='Gemini 3.6 Flash · Thinking（高）';const note=document.querySelector('.model-card p');if(note)note.textContent=providerReady?'Gemini 已連接，按題目、評分參考及學生回答提供逐步引導。':'尚未連接 Gemini：目前可試用逐級提示、短篇閱讀及聯想圖卡。';const select=document.querySelector('#setting-model');if(select){select.innerHTML='<option value="gemini-3.6-flash">Gemini 3.6 Flash · Thinking（高）</option>';select.value='gemini-3.6-flash';}};
render();
connectCoach();

})();
</script>
</body>
</html>
