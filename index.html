 {"keywords":["更多角度","幾種角度","其他角度","寫作角度","分論點角度","讀書角度","讀書的好處","學習的價值","工作機會","解決問題的能力","批判思考","資訊判斷","適應變化","終身學習","自我認識","社會流動","健康素養","公民參與","有甚麼角度","有什麼角度"],"answer":"可以從以下不同角度選兩個，並避免重複：\\n\\n1. 職涯選擇：學習可提供部分職業所需知識與資格；不代表保證工作或高薪。OECD 2025資料顯示教育程度與就業率相關，但各領域和地區有差異。\\n2. 解難與創意：學習讓人練習提出、檢視和改良方法。OECD PISA 2022評估了科學及社會解難等創意思考能力。\\n3. 判斷資訊：讀寫、數理和理解證據有助處理生活資訊；OECD成人技能調查測量這些資訊處理能力，但不能證明只靠學校課堂便能培養。\\n4. 適應變化：持續學習和更新技能有助面對科技及職場轉變；UNESCO把終身學習視為重要方向，這屬政策綜述，不是就業保證。\\n5. 自我認識：接觸不同學科和活動，能幫助學生發現興趣與長處；可用個人經歷說明，但不要把個案說成人人相同。\\n6. 社會流動：教育資格可能打開部分升學和職業機會；OECD資料同時顯示家庭背景仍造成明顯差距。\\n7. 健康與生活素養：理解健康、數據和風險資訊，有助作較知情的生活選擇；不等於教育單獨決定健康。\\n8. 社會參與：公民教育與全球議題學習可提升認識和參與意願；UNESCO資料顯示兩者有關聯，不能直接說成因果。\\n\\n可改寫成分論點：「學習不只為了考試，還能訓練我們評估證據、解決實際問題。」或「持續學習能讓人按工作和社會變化更新技能。」反方可指出學費、壓力或學歷不等於能力；駁論時先承認這些限制，再主張學習也包括職業訓練、實作和終身進修。","next":"選兩個不同角度，分別完成：「學習能幫助＿＿，因為＿＿。」再告訴我你想先找哪一類資料。"},
 {keywords:["中心論點","中心立場","表明立場","同意","不同意","部分同意"],answer:"中心立場要直接回應題目，寫清楚你同意、不同意或部分同意，並限定討論範圍。可用：「我部分同意……，因為……；不過，……。」接着用兩個不同角度支持立場。",next:"試用一句話寫出你的立場。"},
 {keywords:["分論點","分論","論點","理由","兩個論點"],answer:"分論點是支持中心立場的主要理由。先從不同角度構思，例如個人能力、社會影響、短期與長期，再選兩個最有力而不重複的角度。每個分論點要能配上一件切合的事例。",next:"把兩個理由各寫成一句完整主張，檢查它們是否在說同一件事。"},
 {keywords:["重複","相同","不同角度","分開","分論點不同"],answer:"若兩個分論點都只是在說「有幫助」，它們可能重複。可以把角度分開，例如一點談「獲得知識與技能」，另一點談「培養判斷與解難能力」。再問：兩點能否各自用不同事例支持？",next:"試為每個分論點各加一個不同的關鍵詞。"},
 {keywords:["構思","想不到","沒想法","沒有想法","腦震盪","角度","更多角度","其他角度"],answer:"可以從多個不同層面選兩個分論點，避免重複：①職涯與工作選擇；②解難及創意思考；③閱讀、判斷資訊與辨別證據；④適應科技和社會變化、持續學習；⑤認識興趣和長處；⑥教育機會與社會流動；⑦健康及生活素養；⑧公民參與和社會責任。每個角度都要寫清楚「學習如何帶來這種作用」，不要把學歷直接等同能力。可用「學習讓人練習＿＿，因此能在＿＿情況下＿＿」構成主張。",next:"選兩個不同角度；例如一點談解難能力，另一點談工作選擇。告訴我你選哪個角度，我會配對適合的已核實資料。"},
 {keywords:["駁論","駁斥","反駁","反方","反方觀點"],answer:"駁論包括三步：公平地說出反方理由、承認其中合理之處或指出適用條件、再用理由或事例說明為何你的立場仍較有力。不要只寫「我不同意」，也不要扭曲反方觀點。",next:"可用：「有人認為……；這在……情況下有道理；然而……；因此……。」"},
 {keywords:["反方合理","讓步","承認","雖然"],answer:"讓步不是放棄立場，而是承認反方在某些情況下有道理，再說明其限制。例如：「雖然……可能……，但若……，仍然……。」這會令駁論更有分寸。",next:"指出反方觀點在哪些情況下成立，再寫它未能解決甚麼。"},
 {keywords:["論據","證據","例子","事例","例證"],answer:"論據是支持分論點的材料；例子必須切合主張，不能只因為有名就放進文章。寫事例時交代人物或機構、時間、做了甚麼、結果，以及這個結果如何支持你的分論點。",next:"如要真實歷史事件，請說明分論點；我只會從已載入且有來源的事件中提供。"},

 {keywords:["peel","段落","主題句","段落結構"],answer:"一個清楚的論證段可依次寫：主張（Point）、解釋（Explain）、例證（Evidence/Example）、分析連結（Link）。不同老師的 PEEL 定義可能略有差異，重點是每段有主張、支持材料和扣題分析。",next:"先寫主題句，再決定需要哪一種事例。"},

 {keywords:["過渡","連接詞","承上啟下","首先","其次"],answer:"過渡詞要表明關係：補充可用「此外」，轉折可用「然而」，因果可用「因此」，舉例可用「例如」。不要只靠「首先、其次、最後」，還要讓內容本身有邏輯。",next:"先判斷兩句之間是補充、轉折還是因果，再選連接詞。"},
 {keywords:["可靠來源","來源","核實","查證","真假","真實"],answer:"查證事例時優先找原始或可靠機構資料，例如政府、博物館、大學、研究機構或原始演講。核對人物、日期、事件和結果；若來源互相矛盾，需標明不確定，不要補猜細節。",next:"查看資料發布者、原文日期和它實際支持的主張。"},
 {keywords:["引用","參考資料","網址","出處","抄襲"],answer:"引用資料時記下作者或機構、標題、日期和網址，並用自己的話摘要；直接引用原句才加引號。不要把搜尋結果摘要當成自己的原創，也不要引用無法找到原文的數字。",next:"把來源資料和自己的分析分開寫。"},

 {keywords:["讀書無用","讀書有用","教育","學歷","學習","讀書的好處","學習的價值"],answer:"談「讀書有沒有用」可從八個角度選兩項：工作選擇、解決問題、判斷資訊、適應變化、自我認識、社會流動、健康生活素養、公民參與。例：OECD的成人技能調查評估讀寫、數理和適應性解難；OECD的教育報告也呈現教育程度與就業的關聯。不過，這些資料不代表學歷保證工作，也不證明教育單獨造成所有差異。反方可談學費、壓力、學歷不等於能力；回應時可承認限制，再指出學習也包括職業訓練、實作與終身進修。",next:"選一個角度，寫成「學習能幫助＿＿，因為＿＿」。若要事件例子，說明分論點；若要研究數據，告訴我是哪個角度。"},

 {keywords:["時間管理","溫習","考試","學習方法"],answer:"時間管理可從目標、優先次序、分段練習和休息安排入手。與其只寫「要努力」，不如提出可執行方法，例如把大任務拆成短時段、先處理重要項目，再檢視完成情況。",next:"把建議寫成具體行動和預期效果。"},
 {keywords:["詞語","用詞","病句","語句","文句"],answer:"修改語句時先確保主語、謂語和對象清楚，再刪去重複或空泛詞語。把「很有用」改成具體作用，例如「能提高……能力」；避免只堆砌成語而沒有清楚意思。",next:"貼上你想修改的一句，我會指出可改善之處。"},

function normalizedQuery(text){return String(text||"").toLowerCase().replace(/[\s，。！？、；：,.!?;:'"「」『』（）()\[\]【】《》]/g,"");}
function findStaticKnowledge(text){
 const q=normalizedQuery(text);
 return STATIC_KNOWLEDGE.map(item=>({item,score:item.keywords.reduce((n,k)=>n+(q.includes(normalizedQuery(k))?(k.length>=4?3:2):0),0)}))
  .filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0]||null;
}
function historicalEvidenceAnswer(text){
 const t=currentTask(),claim=t.stage===2?store.draft.points[t.index].claim:store.draft.points.map(p=>p.claim).filter(Boolean).join(' ');
 const records=relatedHistoricalEvidence(claim);
 if(!records.length)return '我暫時未找到能直接配對這個分論點的已核實歷史事件。請把分論點中的關鍵詞寫得更具體，或告訴我你想討論哪種能力；我不會猜造事例。';
 return '以下是按你的分論點找到的相關事例。你可點選一項，直接把事件記作論據並進入下一步；不必先讀完資料。資料內容、思考提示和來源供你選擇閱讀及之後核對：\n\n'+records.map((e,i)=>(i+1)+'）'+e.title+'（'+e.kind+'）\n'+e.facts+'\n思考提示：'+e.question+'\n使用限制：'+e.limits+'\n來源：'+e.publisher+'，《'+e.sourceTitle+'》\n'+e.url).join('\n\n');
}
function researchEvidenceAnswer(text){
 const t=currentTask(),claim=t.stage===2?store.draft.points[t.index].claim:store.draft.points.map(p=>p.claim).filter(Boolean).join(' ');
 const history=['中國古代事件','中國現代事件','西方古代事件','西方現代事件'];
 const records=evidenceFor(store.config.topic,claim,text).filter(e=>!history.includes(e.kind));
 if(!records.length)return '目前沒有找到與這個角度直接匹配的研究資料。你可說明是想找工作、解難、資訊判斷、適應變化、社會流動或公民參與的資料；若要歷史事件，請明確說「事件例子」。';
 return '以下是研究或官方資料，並非歷史事件例子。請留意資料的地區、對象和限制：\n\n'+records.map((e,i)=>(i+1)+'）'+e.title+'（'+e.kind+'）\n'+e.facts+'\n使用限制：'+e.limits+'\n來源：'+e.publisher+'，《'+e.sourceTitle+'》\n'+e.url).join('\n\n');
}
function answerStudentQuestion(text){
 const s=String(text||'').trim(),historyWords=/(事件|史實|歷史|真實事例|真實例子)/,researchWords=/(研究|數據|統計|報告|調查|資料|來源)/;
 const wants=/請|可否|能否|提供|找|給我|俾我|推薦|有沒有|有冇|想要|需要|想知道|介紹|列出|哪些|哪個|甚麼|什麼|幫我/.test(s);
 const asks=/[？?]|嗎|請問|解釋|說明|介紹|提供|可否|能否|如何|怎樣|為甚麼|為什麼|點解|有甚麼|有什麼|有沒有|是否|何謂|我想知道|我不懂|幫我|更多|幾種|其他/.test(s);
 const found=findStaticKnowledge(s);
 if(currentTask().stage===1&&wants&&(historyWords.test(s)||researchWords.test(s)))return '先把分論點寫清楚，再找論據會更容易判斷資料是否切題。你現在想主張學習能帶來哪一種具體影響？';
 if(wants&&historyWords.test(s))return historicalEvidenceAnswer(s);
 if(wants&&researchWords.test(s))return researchEvidenceAnswer(s);
 if(!asks&&!(s.length<=20&&found&&/(寫作|分論|駁論|段落|引用|論據)/.test(s)))return '';
 if(found&&currentTask().stage===1)return '我先不替你選分論點。你比較想討論哪個實際情境？學習在那個情境中讓人多了甚麼能力？';
 if(found)return found.item.answer+'\n\n'+found.item.next;
 const t=currentTask();
 if(t.stage===0)return '你可以選「同意、不同意、部分同意」，再加一個原因。先寫：「我（部分）同意／不同意……，因為……。」';
 if(t.stage===1)return '先從你熟悉的生活或工作情境想一想：學習可能幫助人做甚麼？你認為原因是甚麼？先用自己的話說一個理由。';

 if(t.stage===3&&t.index===0)return '先用「有人認為……」公平概括反方理由；不用急着反駁，下一步再寫你的回應。';
 if(t.stage===3)return '可先承認反方在哪種情況下有道理，再指出它的限制，最後連回你的立場。';
 if(t.stage===4)return '逐項檢查：立場有否回應題目？兩個分論點是否不同？事例是否有來源並支持相應分論點？駁論是否交代反方觀點和你的回應？';
 return '我可以協助整理議論文、論據和駁論。告訴我你目前卡在立場、分論點、事例還是駁論，我會按該步驟提供提示。';
}

function pickLocal(options){
 const turns=store.messages.filter(m=>m.from==='student').length;
 return options[(turns-1+options.length)%options.length];
}
function stagePlainExplanation(task){
 if(task.stage===0)return '先回答你對題目的看法：同意、不同意，或部分同意，並寫一個原因。';
 if(task.stage===1)return '分論點就是支持你立場的一個主要理由，而且要和另一點不同。';
 if(task.stage===2)return '事例是支持分論點的具體材料。請找真實事件，並說明它和主張的關係。';
 if(task.stage===3&&task.index===0)return '先公平寫出反方會怎樣想，暫時不用反駁。';
 if(task.stage===3)return '指出反方哪裏有道理，再說明它的限制，最後扣回你的立場。';
 return '大綱已完成，請檢查每個理由是否有相應材料，以及駁論是否回答反方。';
}
function stageHelp(task){
 if(task.stage===0)return '先不用想很複雜。選一項：同意、不同意、部分同意。再補上「因為……」。\n\n'+taskQuestion();
 if(task.stage===1)return '先用自己的話說明一個支持立場的理由。想想學習幫助誰、培養甚麼能力，以及這種能力何時有用；若答案仍籠統，我再提供角度提示。\n\n'+taskQuestion();
 if(task.stage===2)return '先看你的分論點中的關鍵詞，再從已載入的事件資料中找相關人物、制度或事件。你也可以直接要求我提供已核實事件候選。\n\n'+taskQuestion();
 if(task.stage===3&&task.index===0)return '想像持相反立場的人會擔心甚麼，例如成本、壓力、機會不均或學歷和能力不相等。先公平寫一個理由。\n\n'+taskQuestion();
 if(task.stage===3)return '先承認反方在哪些情況下有道理，再指出條件或限制，最後解釋為何你的立場仍成立。\n\n'+taskQuestion();
 return '目前大綱已完成。你可以要求我檢查重複、扣題、事例和駁論。';
}
function localScenarioReply(text,task){
 const s=String(text||'').trim();
 const found=LOCAL_DIALOGUE_SCENARIOS.find(([pattern])=>pattern.test(s));
 return found?found[1](task):'';
}

 return /想不到|想不出|不知道|唔知|沒有例子|沒有事例|未能舉例|提供閱讀|不懂/.test(s)||s.length<8||/^(沒有想法|有好有壞|讀書有用|讀書無用|很好|不好|很重要|都有道理|我覺得很好|因為很好|因為有用|我認為這很重要)[啊呀呢吧]*$/.test(s)||(s.length<45&&/很重要|有好處|有用|很好|很不好/.test(s)&&!/例如|因為|如果|當|可以|能夠|所以/.test(s));
}

 const next=index===0?'已把「'+record.title+'」直接記作分論點一的論據。現在進入第二個分論點：請提出一個與第一點不同、同樣支持你立場的理由。': '已把「'+record.title+'」直接記作分論點二的論據。下一步請構思反方觀點。';
 store.messages.push({from:'coach',move:talkMoves[store.stage].label,text:next+'\n\n'+taskQuestion()});
 save();render();celebrateProgress();
 const log=document.querySelector('#chat-log');if(log)log.scrollTop=log.scrollHeight;
}

function chatPanel(){const latest=store.messages.map(m=>m.from).lastIndexOf('coach');return `<div class="chat-head"><div class="coach-id"><div class="coach-avatar">論</div><div><strong>論證教練</strong><small>逐步提問 · 整理想法</small></div></div><div class="chat-head-actions"><span class="online"><i></i>本機情境對答 · 靜態資料</span><button class="btn ghost" data-action="reset" ${coachBusy?'disabled':''}>重新開始對話</button></div></div><div class="chat-log" id="chat-log">${store.messages.map((m,i)=>`<div class="bubble-row ${m.from==='student'?'me':''} ${i===latest?'latest-coach':''}"><div class="bubble">${coachText(m.text)}${supportMarkup(m)}</div></div>`).join('')}</div><div class="typing" id="typing"></div><div class="chat-compose">${suggestedAnswerPanel()}<div class="compose-row"><textarea id="coach-input" rows="2" placeholder="寫下想法、提問，或選下方情境……"></textarea><button class="btn primary" data-action="send" ${coachBusy?'disabled':''}>${coachBusy?'思考中…':'送出'} ${icon('arrow')}</button></div></div>`;}
function openDraftEditor(field){
 const dialog=$('#draft-edit-dialog');if(!dialog)return;
 const title=$('#draft-edit-title'),value=$('#draft-edit-value'),key=$('#draft-edit-key'),note=$('#draft-edit-note');
 let current='',label='',hint='';
 const point=field.match(/^point-(0|1)-(claim|evidence)$/);
 if(point){const i=Number(point[1]),part=point[2];label=part==='claim'?'分論點 '+(i+1):'分論點 '+(i+1)+' 的事例';current=store.draft.points[i][part];if(part==='claim')hint='修改分論點後，原有事例會清除，請重新配對切合的新事例。';}
 else if(field==='rebuttal-opposing'){label='反方觀點';current=store.draft.rebuttal.opposing;hint='修改反方觀點後，原有回應會清除，避免回應錯誤對象。';}
 else if(field==='rebuttal-response'){label='駁論回應';current=store.draft.rebuttal.response;}
 else return;
 title.textContent='編輯'+label;value.value=current;key.value=field;note.textContent=hint||'只會修改這一部分，其餘內容會保留。';
 dialog.showModal();value.focus();
}
function saveDraftEdit(field,value){
 const point=field.match(/^point-(0|1)-(claim|evidence)$/);let label='',cleared='';
 if(point){const i=Number(point[1]),part=point[2],p=store.draft.points[i];label='分論點 '+(i+1)+(part==='claim'?'':' 的事例');if(part==='claim'){if(p.claim.trim()!==value){p.evidence='';p.reasoning='';cleared='已清除該分論點原有事例，請重新配對。';}p.claim=value;}else{p.evidence=value;p.reasoning='';}}
 else if(field==='rebuttal-opposing'){label='反方觀點';if(store.draft.rebuttal.opposing.trim()!==value){store.draft.rebuttal.response='';cleared='已清除原有駁論回應，請按新觀點重新回應。';}store.draft.rebuttal.opposing=value;}
 else if(field==='rebuttal-response'){label='駁論回應';store.draft.rebuttal.response=value;}
 else return;
 const dialog=$('#draft-edit-dialog');if(dialog?.open)dialog.close();
 store.stage=currentTask().stage;store.helpLevel=0;store.messages.push({from:'coach',text:'已更新「'+label+'」。'+(cleared?' '+cleared:' 其他部分已保留。')});
 save();render();toast('已儲存修改。');
}
function draftEditDialog(){return `<dialog class="edit-dialog" id="draft-edit-dialog"><form id="draft-edit-form"><h2 id="draft-edit-title">編輯內容</h2><p id="draft-edit-note">只會修改這一部分，其餘內容會保留。</p><input id="draft-edit-key" type="hidden"><textarea id="draft-edit-value" required aria-label="修改內容"></textarea><div class="edit-dialog-actions"><button type="button" class="btn ghost" data-action="cancel-edit">取消</button><button type="submit" class="btn primary">儲存修改</button></div></form></dialog>`;}
function canvas(full=false){const d=store.draft;return `<div class="canvas-head"><div><h2>論證架構</h2><p>立場、兩個分論點、各自事例及一個駁論。</p></div><div class="completion">${progress()}%<div class="completion-bar"><span style="width:${progress()}%"></span></div></div></div><div class="draft-card position"><h3>中心立場</h3><p>${esc(d.position||'先寫出你的立場。')}</p></div>${d.points.slice(0,2).map((p,i)=>`<div class="draft-card point"><h3>分論點 ${i+1}<span class="draft-inline-actions"><button class="btn ghost mini-edit" data-action="edit-field" data-field="point-${i}-claim">編輯分論點</button><button class="btn ghost mini-edit" data-action="edit-field" data-field="point-${i}-evidence">編輯事例</button></span></h3><p>${esc(p.claim||'待構思')}</p><div class="mini-line"><b>事例（論據）：</b>${esc(p.evidence||'待配對真實事件')}</div></div>`).join('')}<div class="draft-card rebuttal"><h3>駁論<span class="draft-inline-actions"><button class="btn ghost mini-edit" data-action="edit-field" data-field="rebuttal-opposing">編輯反方觀點</button><button class="btn ghost mini-edit" data-action="edit-field" data-field="rebuttal-response">編輯回應</button></span></h3><p><b>反方觀點：</b>${esc(d.rebuttal.opposing||'待提出反方觀點')}</p><div class="mini-line"><b>駁論回應：</b>${esc(d.rebuttal.response||'待回應反方觀點')}</div></div><div class="card-actions">${full?'<button class="btn ghost" data-action="reset">重新開始對話</button>':''}<button class="btn gold" data-action="report">儲存學習報告</button></div>${draftEditDialog()}`;}
function teacherView(){return `<div class="layout"><aside class="sidebar"><p class="side-kicker">Teaching space</p><nav class="side-nav"><button data-action="view" data-view="settings" class="${store.view==='settings'?'active':''}">${icon('settings')} 題目與評分設定</button><button data-action="view" data-view="reports" class="${store.view==='reports'?'active':''}">${icon('chart')} 學生學習報告</button></nav><div class="side-note"><strong>教師後台</strong>本機試行：設定題目與目標結構，體驗提問及報告流程。</div></aside><main class="main">${mobileNav()}<div class="page-head"><div><div class="eyebrow">TEACHER CONSOLE · LOCAL DEMO</div><h1>${store.view==='reports'?'看見學生怎樣思考。':'設定一個好的追問路線。'}</h1><p>${store.view==='reports'?'從對話歷程和論證架構了解學生的學習情況。':'題目和評分設定只在本機使用；聊天不會連接生成式 AI 或即時搜尋。'}</p></div><div class="head-meta"><strong>${store.reports.length}</strong>份已儲存報告<br><span>教師測試版</span></div></div>${store.view==='reports'?reportsView():settingsView()}<p class="footer-note">本機靜態版本：對答來自預先編寫的情境和內置資料；草稿及報告儲存在目前瀏覽器。</p></main></div>`;}
function settingsView(){const c=store.config;return `<section class="teacher-section panel panel-pad"><h2>題目與評分參考</h2><p class="section-sub">這些設定會影響學生看到的題目、本機教練的提問方向和報告中的評估項目。</p><div class="model-card"><div><strong>本機情境式對答</strong><p>不連接生成式 AI、Worker 或即時搜尋。網站會按常見提問、目前學習步驟和已載入資料提供對答；未收錄的問題會說明限制。</p></div><span class="model-badge">靜態模式</span></div><form id="settings-form" style="margin-top:20px"><div class="form-grid"><div class="form-field full"><label for="setting-topic">議論文題目</label><input id="setting-topic" name="topic" value="${esc(c.topic)}" required></div><div class="form-field full"><label for="setting-prompt">寫作要求／背景</label><textarea id="setting-prompt" name="prompt" required>${esc(c.prompt)}</textarea></div><div class="form-field"><label for="setting-target">目標結構</label><select id="setting-target" name="target"><option value="two-plus-rebuttal" selected>兩個分論點＋一個駁論</option></select></div><div class="form-field"><label>聊天模式</label><p class="field-note">本機預設情境對答，不需設定 API。</p></div><div class="form-field full"><div class="rubric-box"><h3>評分參考（會顯示在教師報告）</h3><div class="check-grid">${defaultConfig.rubrics.map((r,i)=>`<label class="check"><input type="checkbox" name="rubric" value="${esc(r)}" ${(c.rubrics||[]).includes(r)?'checked':''}>${esc(r)}</label>`).join('')}</div></div></div></div><div class="form-actions"><button type="button" class="btn ghost" data-action="reset-config">還原示範題目</button><button class="btn primary" type="submit">儲存設定 ${icon('check')}</button></div></form></section>`;}
function reportsView(){if(!store.reports.length)return `<section class="panel empty">尚未有學生報告。先切換到「學生端」完成一次示範，再回來查看報告。</section>`;return `<div class="stats"><div class="stat"><span>已提交報告</span><strong>${store.reports.length}</strong><small>份學習紀錄</small></div><div class="stat"><span>平均完成度</span><strong>${Math.round(store.reports.reduce((a,r)=>a+r.progress,0)/store.reports.length)}%</strong><small>架構建立情況</small></div><div class="stat"><span>已填立場</span><strong>${store.reports.filter(r=>r.position).length}</strong><small>學生能表明取態</small></div><div class="stat"><span>事例齊備</span><strong>${store.reports.filter(r=>(r.examples||[]).filter(Boolean).length===2).length}</strong><small>兩個分論點均有事例</small></div></div><section class="report-list">${store.reports.map((r,i)=>`<article class="panel report-row"><div><h3>${esc(r.student||'示範學生')}</h3><p>${esc(r.topic)} · ${esc(r.time)}</p></div><div><div class="report-progress"><span style="width:${r.progress}%"></span></div><p style="margin-top:6px">${r.progress}% 架構完成度</p></div><div class="report-score">${r.points}<small>個分論點已捕捉</small></div><span class="report-chip">${(r.examples||[]).filter(Boolean).length===2?'事例齊備':'仍需補充事例'}</span><button class="btn ghost" data-action="toggle-report" data-index="${i}">查看詳情 ${icon('arrow')}</button>${store.expandedReport===i?`<div class="report-detail"><b>立場：</b>${esc(r.position||'尚未填寫')}<br><b>分論點：</b>${esc(r.claims.join('；')||'尚未填寫')}<br><b>配對事例：</b>${esc((r.examples||[]).map((v,i)=>'分論點'+(i+1)+'：'+(v||'待補充')).join('；')||'舊報告未記錄事例')}<br><b>教學建議：</b>${esc(r.suggestion)}</div>`:''}</article>`).join('')}</section><div class="form-actions"><button class="btn primary" data-action="export-reports">${icon('download')} 匯出 CSV</button><button class="btn danger" data-action="clear-reports">清除示範報告</button></div>`;}
function submitReport(){const d=store.draft;const report={student:'student01（示範）',topic:store.config.topic,time:new Intl.DateTimeFormat('zh-HK',{dateStyle:'medium',timeStyle:'short'}).format(new Date()),progress:progress(),points:d.points.filter(p=>p.claim).length,position:d.position,claims:d.points.map(p=>p.claim),examples:d.points.map(p=>p.evidence),suggestion:progress()<100?'請補齊分論點及對應的具體事例。':'請檢查兩個分論點是否互不重複，駁論是否回應反方，以及事例是否適切。'};store.reports=[report,...store.reports.filter(r=>r.student!=='student01（示範）')];save();toast('已儲存學習報告。');render();}
function resetDraft(){rewardedMilestones.clear();store.draft={position:'',points:[{claim:'',evidence:'',reasoning:''},{claim:'',evidence:'',reasoning:''}],rebuttal:{opposing:'',response:''}};store.messages=[];store.stage=0;store.helpLevel=0;store.helpStage=0;save();render();toast('已重新開始對話。');}
function exportReports(){const rows=[['學生','題目','完成度','分論點數','配對事例','立場','分論點','日期'],...store.reports.map(r=>[r.student,r.topic,r.progress+'%',r.points,(r.examples||[]).map((v,i)=>'分論點'+(i+1)+'：'+v).join('；'),r.position,r.claims.join('；'),r.time])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='議論文學習報告.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已匯出 CSV 報告。');}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const a=b.dataset.action;
  if(a==='login-portal'&&!store.role){loginPortal=b.dataset.role==='teacher'?'teacher':'student';render();return;}
  if(!store.role)return;
  if(a==='logout'&&!coachBusy){loginPortal=store.role;store.role=null;render();return;}
  if(a==='edit-field'&&store.role==='student'){openDraftEditor(b.dataset.field);return;}
  if(a==='cancel-edit'){const dialog=$('#draft-edit-dialog');if(dialog?.open)dialog.close();return;}
  if(a==='view'){
    const allowed=store.role==='teacher'?['settings','reports']:['coach','draft'];
    if(allowed.includes(b.dataset.view)){store.view=b.dataset.view;render();}
  }else if(a==='send'&&store.role==='student'){const input=$('#coach-input');if(input?.value.trim())askCoach(input.value.trim());}
  else if(a==='quick'&&store.role==='student'){const input=$('#coach-input'),text=b.dataset.text||'';if(b.dataset.submit==='true'){askCoach(text);}else if(input){input.value=text;input.focus();}}
  else if(a==='evidence-select'&&store.role==='student'){selectEvidenceChoice(b.dataset.text||'');}
  else if(a==='report'&&store.role==='student')submitReport();
  else if(a==='reset'&&store.role==='student'&&!coachBusy){if(window.confirm('重新開始會清除本次對話、立場、分論點、事例和駁論；已儲存的報告及題目設定會保留。確定重新開始？'))resetDraft();}
  else if(store.role==='teacher'){
    if(a==='reset-config'){store.config={...defaultConfig};save();render();toast('已還原示範題目。');}
    else if(a==='toggle-report'){store.expandedReport=store.expandedReport===Number(b.dataset.index)?null:Number(b.dataset.index);render();}
    else if(a==='export-reports')exportReports();
    else if(a==='clear-reports'){store.reports=[];save();render();toast('已清除示範報告。');}
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='draft-edit-form'&&store.role==='student'){
    e.preventDefault();const field=$('#draft-edit-key').value,value=$('#draft-edit-value').value.trim();
    if(value)saveDraftEdit(field,value);return;
  }
  if(e.target.id==='essay-login-form'){
    e.preventDefault();const fd=new FormData(e.target);
    const teacher=loginPortal==='teacher',username=String(fd.get('username')||'').trim(),password=String(fd.get('password')||'');
    const valid=teacher?(username==='teacher01'&&password==='Teach123!'):(/^student(?:0[1-9]|1[0-5])$/.test(username)&&password==='Learn123!');
    if(!valid){$('#login-error').textContent=teacher?'帳戶或密碼不正確，請使用老師示範帳戶。':'帳戶須為 student01 至 student15，密碼為 Learn123!。';return;}
    if(!teacher){
      const previous=store.studentLabel;
      if(previous&&previous!==username)saveStudentProgress(previous);
      if(previous!==username){
        const savedProgress=readStudentProgress(username);
        store.draft=savedProgress?.draft||emptyStudentDraft();
        store.messages=savedProgress?.messages||initialMessages();
        store.stage=savedProgress?.stage||0;store.helpLevel=savedProgress?.helpLevel||0;store.helpStage=savedProgress?.helpStage||0;
        
      
      store.studentLabel=username;save();
    }
  }
  store.role=loginPortal;store.view=teacher?'settings':'coach';render();return;
  }
  if(e.target.id!=='settings-form'||store.role!=='teacher')return;
  e.preventDefault();const fd=new FormData(e.target);
  store.config={topic:fd.get('topic').trim(),prompt:fd.get('prompt').trim(),target:'two-plus-rebuttal',model:'static-dialogue-v1',rubrics:fd.getAll('rubric')};
  save();toast('題目與評分參考已儲存。');render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey&&e.target.id==='coach-input'){e.preventDefault();const b=document.querySelector('[data-action="send"]');b?.click();}});
function normalizeState(){const raw=store.draft&&typeof store.draft==='object'?store.draft:{};const rawPoints=Array.isArray(raw.points)?raw.points:[];store.config={...defaultConfig,...(store.config&&typeof store.config==='object'?store.config:{})};store.draft={position:typeof raw.position==='string'?raw.position:'',points:[0,1].map(i=>{const p=rawPoints[i]&&typeof rawPoints[i]==='object'?rawPoints[i]:{};return {claim:typeof p.claim==='string'?p.claim:'',evidence:typeof p.evidence==='string'?p.evidence:'',reasoning:typeof p.reasoning==='string'?p.reasoning:''};}),rebuttal:{opposing:typeof raw.rebuttal?.opposing==='string'?raw.rebuttal.opposing:'',response:typeof raw.rebuttal?.response==='string'?raw.rebuttal.response:''}};store.messages=Array.isArray(store.messages)?store.messages.filter(m=>m&&typeof m.text==='string').map(m=>({from:m.from==='student'?'student':'coach',move:typeof m.move==='string'?m.move:'',text:m.text,support:m.support&&typeof m.support==='object'?m.support:null})):[];store.reports=Array.isArray(store.reports)?store.reports.filter(r=>r&&typeof r==='object').map(r=>({...r,claims:Array.isArray(r.claims)?r.claims.filter(Boolean):[]})):[];store.stage=Number.isFinite(Number(store.stage))?Math.max(0,Math.min(6,Math.floor(Number(store.stage)))):0;}
normalizeState();
store.config.target='two-plus-rebuttal';
store.config.rubrics=(store.config.rubrics||[]).filter(x=>!['能說明論據如何支持分論點','能預想反方觀點並有效駁論'].includes(x));
if(!store.config.rubrics.includes('事例能支持對應分論點'))store.config.rubrics.push('事例能支持對應分論點');
if(store.config.prompt.includes('具體論據及完整論證'))store.config.prompt=defaultConfig.prompt;
store.stage=currentTask().stage;
if(saved.flowVersion!==5&&store.messages.some(m=>m.from==='student'))store.messages.push({from:'coach',text:'網站已切換為本機情境式對答，不會連接生成式 AI 或即時搜尋。舊草稿和對話已保留；新的回覆會由內置情境和資料提供。'});

store.messages=store.messages.map(m=>m.support&&!Array.isArray(m.support.evidenceIds)?{...m,text:'過往的閱讀提示已停用。請重新要求閱讀資料，以查看附有已核對來源的材料。',support:null}:m);
rewardedMilestones=new Set(milestoneKeys());
// Adopt the new sample only when no existing student work would be relabelled.
if(store.config.topic==='中學生應否限制使用生成式人工智能？'&&!store.draft.position.trim()&&!store.messages.some(m=>m.from==='student')){
  store.config.topic=defaultConfig.topic;
}
if(!store.messages.some(m=>m.from==='student'))store.messages=initialMessages();
else store.messages=store.messages.map(m=>m.move==='Welcome'?initialMessages()[0]:m);
store.config.model='static-dialogue-v1';
const originalRender=render;
render=function(){
  originalRender();
  const card=document.querySelector('.model-card strong');
  if(card)card.textContent='本機情境式對答';
  const note=document.querySelector('.model-card p');
  if(note)note.textContent='不連接生成式 AI、Worker 或即時搜尋。網站會按常見提問、目前學習步驟和已載入資料提供對答；未收錄的問題會說明限制。';
  const badge=document.querySelector('.model-badge');
  if(badge)badge.textContent='靜態模式';
};
render();
})();
</script>
</body>
